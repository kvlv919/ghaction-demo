name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'                 # 推送形如 v0.0.1 的 tag 时自动触发
  workflow_dispatch:         # 也支持在 Actions 页手动点按钮触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tool
        run: |
          python -m pip install --upgrade pip build

      - name: Build package
        run: |
          cd proj1-hellopy
          python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: proj1-hellopy/dist