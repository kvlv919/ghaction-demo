[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yummypy"
version = "0.1.0"
authors = [
  { name = "blacksnow81", email = "blacksnow81@sohu.com" }
]
description = "My first package published to PyPI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
